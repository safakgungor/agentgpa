packages:
  - packages/*

# Supply chain: install only versions published at least 14 days ago.
minimumReleaseAge: 20160

# A fix for a high advisory ships within 7 days (SECURITY.md): zod 4.6.5 and older can exhaust
# memory while validating oversized constrained collections (GHSA-mrhx-c7xc-m3w5), and 4.6.6 is
# 12 days old on 2026-10-23. It comes out of this list on 2026-10-25, when 4.6.6 is 14 days old.
minimumReleaseAgeExclude:
  - zod

# No dependency runs an install script. esbuild's only speeds up its own start, and it works
# without it.
allowBuilds:
  esbuild: false

# vitest takes vite as a peer, and vite 8.3.0 to 8.3.2 have a high advisory
# (GHSA-587h-7wmj-h5pm) and two moderate ones. The tree takes 8.3.3 or newer until vitest's own
# range does.
overrides:
  vite: ^8.3.3
