packages:
  - packages/*

# Supply chain: install only versions published at least 14 days ago.
minimumReleaseAge: 20160

# No dependency runs an install script. esbuild's only speeds up its own start, and it works
# without it.
allowBuilds:
  esbuild: false

# vitest takes vite as a peer, and vite 8.3.0 to 8.3.2 have a high advisory
# (GHSA-587h-7wmj-h5pm) and two moderate ones. The tree takes 8.3.3 or newer until vitest's own
# range does.
overrides:
  vite: ^8.3.3
