name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories in what the CLI bundles fail the build (SECURITY.md, Dependencies).
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Timed on its own, with no tests sharing the CPU: 5 seconds on 4 threads, about a
      # five-year-old laptop, and proportionally longer on a runner with fewer.
      - run: node scripts/bench-pow.ts
      - run: pnpm --filter agentgpa dev -- --help
      # The published package: one bundled file and its licenses, nothing else.
      - run: pnpm --filter agentgpa build
      - run: node scripts/check-pack.ts
      - run: node packages/cli/dist/agentgpa.mjs --version

  standalone:
    name: standalone build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built twice: the same sources must give the same file, so anyone can check a release.
      - name: Build twice and compare
        shell: bash
        working-directory: packages/cli
        run: |
          node standalone.ts
          cp dist/agentgpa-*.sha256 "$RUNNER_TEMP/first.sha256"
          node standalone.ts
          diff <(cut -d' ' -f1 dist/agentgpa-*.sha256) <(cut -d' ' -f1 "$RUNNER_TEMP/first.sha256")
          cat dist/agentgpa-*.sha256
      - name: Start it
        shell: bash
        working-directory: packages/cli
        run: |
          binary="$(ls dist/agentgpa-* | grep -v '\.sha256$')"
          "./$binary" --version
          AGENTGPA_CONFIG_DIR="$RUNNER_TEMP/config" "./$binary" --offline --root ../../fixtures/home
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentgpa-${{ matrix.os }}
          path: |
            packages/cli/dist/agentgpa-*
          retention-days: 7

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pinned release, checked against its published SHA-256 before it runs.
      - name: Install gitleaks 8.30.1
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # --redact keeps any secret it finds out of the log; -v shows where it is.
      - run: '"$RUNNER_TEMP/gitleaks" git -v --redact --no-banner --log-opts="--all" .'
